[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-engineering-analyzer"
version = "1.0.0"
description = "Interactive tool to quantify the impact of feature engineering on model performance."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sushant Kumar" }]
keywords = ["machine-learning", "feature-engineering", "streamlit", "data-science", "scikit-learn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "streamlit>=1.31,<2",
    "pandas>=2.0,<3",
    "numpy>=1.24,<3",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.7,<4",
    "seaborn>=0.13,<1",
    "joblib>=1.3,<2",
]

[project.urls]
Homepage = "https://github.com/sushantkumar31/feature-engineering-analyzer"
Repository = "https://github.com/sushantkumar31/feature-engineering-analyzer"
Issues = "https://github.com/sushantkumar31/feature-engineering-analyzer/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = [".venv", "assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
